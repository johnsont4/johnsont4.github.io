<section class="news-section">
  <h2>News</h2>
  <div class="news-scroll">
    {% for item in site.data.news %}
    <div class="news-row">
      <span class="news-date"><strong>{{ item.date }}</strong></span>
      <span class="news-text">{{ item.text | markdownify | remove: '<p>' | remove: '</p>' }}</span>
    </div>
    {% endfor %}
  </div>
</section>
<script>
  (function () {
    var box = document.querySelector('.news-scroll');
    if (!box) return;
    function update() {
      box.classList.toggle('at-end', box.scrollTop + box.clientHeight >= box.scrollHeight - 2);
    }
    box.addEventListener('scroll', update);
    window.addEventListener('resize', update);
    update();
  })();
</script>
